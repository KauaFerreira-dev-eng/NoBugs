spring.application.name=nobugs

# Banco H2 em arquivo (pasta ./data): os dados continuam depois de desligar o sistema
spring.datasource.url=jdbc:h2:file:./data/nobugs
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Console do banco em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Login: senha inicial dos usuários criados na primeira execução (admin e um por órgão). Só para desenvolvimento.
nobugs.senha-inicial=nobugs123

# Sessão do login: expira em 30 minutos parado; o cookie não vai em requisições de outros sites
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax