spring.application.name=nobugs

# Banco H2 em arquivo (pasta ./data): os dados continuam depois de desligar o sistema
spring.datasource.url=jdbc:h2:file:./data/nobugs
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Sessão de login: cookie só enviado pelo próprio site, inacessível ao JavaScript, expira em 30 min sem uso
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Console do banco: desligado por padrão (era aberto a qualquer um). Para ver o banco, troque para true
# e libere "/h2-console/**" em SecurityConfig, só na sua máquina.
spring.h2.console.enabled=false
