<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cidade Ouve</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1b2a33; }
    h1 { margin-bottom: .2rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: .5rem; margin-top: .3rem; box-sizing: border-box; font: inherit; }
    button { margin-top: 1rem; padding: .6rem 1rem; font: inherit; cursor: pointer; }
    .msg { margin-top: 1rem; padding: .8rem; border-radius: 6px; }
    .ok { background: #e3f6e8; } .erro { background: #fde7e7; }
    small { color: #5b6b75; }
    li { margin-bottom: .6rem; }
    .admin { margin-top: 2rem; padding: 1rem; border: 1px solid #c9d3da; border-radius: 6px; }
    .reatribuir { display: flex; gap: .5rem; margin-top: .3rem; }
    .reatribuir select { margin-top: 0; }
    .reatribuir button { margin-top: 0; white-space: nowrap; }
    .historico { display: block; color: #5b6b75; margin-top: .2rem; }
  </style>
</head>
<body>
  <h1>Cidade Ouve</h1>
  <p>Registre um problema urbano no seu bairro.</p>

  <form id="form">
    <label for="categoria">Categoria *</label>
    <select id="categoria"><option value="">Selecione...</option></select>

    <label for="descricao">Descrição *</label>
    <textarea id="descricao" rows="4" maxlength="500"></textarea>
    <small><span id="contador">0</span>/500</small>

    <label for="endereco">Endereço</label>
    <input id="endereco" placeholder="Rua, número, bairro">
    <button type="button" id="gps">Usar minha localização</button>
    <small id="coords"></small>

    <button type="submit">Enviar ocorrência</button>
  </form>

  <div id="resultado"></div>

  <div class="admin">
    <h2 style="margin-top:0">Área do órgão / administrador</h2>
    <div id="sessao"></div>

    <label for="filtroOrgao">Ver ocorrências do órgão</label>
    <select id="filtroOrgao"><option value="">Todos</option></select>
  </div>

  <div id="resultadoAdmin"></div>

  <h2>Ocorrências registradas</h2>
  <ul id="lista"></ul>

  <script>
    let latitude = null, longitude = null;
    const $ = (id) => document.getElementById(id);

    async function carregarCategorias() {
      const resp = await fetch('/ocorrencias/categorias');
      (await resp.json()).forEach(c => {
        const op = document.createElement('option');
        op.value = c.codigo; op.textContent = c.nome;
        $('categoria').appendChild(op);
      });
    }

    let orgaos = [];

    async function carregarOrgaos() {
      const resp = await fetch('/ocorrencias/orgaos');
      orgaos = await resp.json();
      orgaos.forEach(o => {
        const op = document.createElement('option');
        op.value = o.codigo; op.textContent = o.nome;
        $('filtroOrgao').appendChild(op);
      });
    }

    let usuarioAtual = null;

    const podeReatribuir = () => usuarioAtual && ['ORGAO_PUBLICO', 'ADMINISTRADOR'].includes(usuarioAtual.perfil);

    async function carregarSessao() {
      const resp = await fetch('/auth/eu');
      usuarioAtual = resp.ok ? await resp.json() : null;
      const box = $('sessao');
      box.textContent = '';
      const link = document.createElement('a');
      link.href = '/painel.html';
      if (usuarioAtual) {
        box.append(`Logado como ${usuarioAtual.nome}. `);
        link.textContent = 'Abrir painel de gráficos';
        box.appendChild(link);
      } else {
        link.textContent = 'Entrar';
        box.append(link, ' para trocar o órgão de uma ocorrência e ver os gráficos.');
      }
    }
    const nomeOrgao = (codigo) => (orgaos.find(o => o.codigo === codigo) || {}).nome || codigo;

    async function carregarLista() {
      const filtro = $('filtroOrgao').value;
      const resp = await fetch('/ocorrencias' + (filtro ? `?orgao=${filtro}` : ''));
      const lista = $('lista'); lista.innerHTML = '';
      (await resp.json()).forEach(o => {
        const li = document.createElement('li');
        li.textContent = `${o.protocolo} | ${o.categoria} | órgão: ${nomeOrgao(o.orgao)} | ${o.status} | ${o.descricao}`;

        if (podeReatribuir()) {
          const linha = document.createElement('div');
          linha.className = 'reatribuir';
          const sel = document.createElement('select');
          orgaos.forEach(og => {
            const op = document.createElement('option');
            op.value = og.codigo; op.textContent = og.nome;
            if (og.codigo === o.orgao) op.selected = true;
            sel.appendChild(op);
          });
          const btn = document.createElement('button');
          btn.type = 'button'; btn.textContent = 'Reatribuir';
          btn.addEventListener('click', () => reatribuir(o.id, sel.value));
          linha.append(sel, btn);
          li.appendChild(linha);
        }

        const hist = document.createElement('small');
        hist.className = 'historico';
        li.appendChild(hist);
        carregarHistorico(o.id, hist);

        lista.appendChild(li);
      });
    }

    async function carregarHistorico(id, elemento) {
      const resp = await fetch(`/ocorrencias/${id}/historico`);
      if (!resp.ok) return;
      const trocas = await resp.json();
      if (trocas.length === 0) return;
      const t = trocas[0];
      elemento.textContent = `Última troca: ${nomeOrgao(t.orgaoAnterior)} → ${nomeOrgao(t.orgaoNovo)}`
        + ` por ${t.autor} em ${new Date(t.dataHora).toLocaleString('pt-BR')}`;
    }

    async function reatribuir(id, orgao) {
      const resp = await fetch(`/ocorrencias/${id}/orgao`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orgao })
      });
      const dados = await resp.json();
      const box = $('resultadoAdmin');
      if (resp.ok) {
        box.className = 'msg ok';
        box.textContent = `Ocorrência ${dados.protocolo} reatribuída para: ${nomeOrgao(dados.orgao)}`;
        carregarLista();
      } else {
        box.className = 'msg erro';
        box.textContent = dados.campos ? Object.values(dados.campos).join(' | ') : dados.erro;
      }
    }

    $('filtroOrgao').addEventListener('change', carregarLista);

    $('descricao').addEventListener('input', () => { $('contador').textContent = $('descricao').value.length; });

    $('gps').addEventListener('click', () => {
      if (!navigator.geolocation) { $('coords').textContent = 'Seu navegador não tem GPS. Digite o endereço.'; return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          latitude = pos.coords.latitude; longitude = pos.coords.longitude;
          $('coords').textContent = `Localização capturada: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
        },
        () => { latitude = longitude = null; $('coords').textContent = 'Sem permissão ou GPS falhou. Digite o endereço.'; }
      );
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const corpo = {
        descricao: $('descricao').value,
        categoria: $('categoria').value || null,
        endereco: $('endereco').value,
        latitude, longitude
      };
      const resp = await fetch('/ocorrencias', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo)
      });
      const dados = await resp.json();
      const box = $('resultado');
      if (resp.ok) {
        box.className = 'msg ok';
        box.textContent = `Ocorrência registrada! Protocolo: ${dados.protocolo} (encaminhada a: ${dados.orgao})`;
        $('form').reset(); latitude = longitude = null; $('coords').textContent = ''; $('contador').textContent = '0';
        carregarLista();
      } else {
        box.className = 'msg erro';
        box.textContent = dados.campos ? Object.values(dados.campos).join(' | ') : dados.erro;
      }
    });

    carregarCategorias();
    Promise.all([carregarSessao(), carregarOrgaos()]).then(carregarLista);
  </script>
</body>
</html>
