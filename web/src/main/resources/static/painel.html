<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do órgão - Cidade Ouve</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1b2a33; }
    h1 { margin-bottom: .2rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select { width: 100%; padding: .5rem; margin-top: .3rem; box-sizing: border-box; font: inherit; }
    button { margin-top: 1rem; padding: .6rem 1rem; font: inherit; cursor: pointer; }
    .msg { margin-top: 1rem; padding: .8rem; border-radius: 6px; background: #fde7e7; }
    .oculto { display: none; }
    #telaLogin { max-width: 360px; }
    .topo { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
    .topo button { margin-top: 0; }
    .filtro { max-width: 320px; }
    .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .cartao { border: 1px solid #c9d3da; border-radius: 8px; padding: 1rem; }
    .cartao strong { display: block; font-size: 1.8rem; }
    .cartao span { color: #5b6b75; }
    .graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 1.5rem; }
    .grafico { border: 1px solid #c9d3da; border-radius: 8px; padding: 1rem; }
    .grafico h3 { margin: 0 0 .5rem; font-size: 1rem; }
    .vazio { color: #5b6b75; }
  </style>
</head>
<body>
  <h1>Painel do órgão</h1>
  <p><a href="/">← Voltar para as ocorrências</a></p>

  <!-- Tela de login -->
  <div id="telaLogin" class="oculto">
    <form id="formLogin">
      <label for="login">Login</label>
      <input id="login" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
    <div id="erroLogin"></div>
  </div>

  <!-- Painel com os gráficos -->
  <div id="telaPainel" class="oculto">
    <div class="topo">
      <span id="quem"></span>
      <button type="button" id="sair">Sair</button>
    </div>

    <div id="blocoFiltro" class="filtro oculto">
      <label for="filtroOrgao">Órgão</label>
      <select id="filtroOrgao"><option value="">Todos</option></select>
    </div>

    <div class="cartoes">
      <div class="cartao"><strong id="kTotal">0</strong><span>ocorrências</span></div>
      <div class="cartao"><strong id="kAbertas">0</strong><span>em aberto</span></div>
      <div class="cartao"><strong id="kResolvidas">0</strong><span>resolvidas</span></div>
      <div class="cartao"><strong id="kTaxa">0%</strong><span>taxa de resolução</span></div>
    </div>

    <div class="graficos">
      <div class="grafico"><h3>Por situação</h3><canvas id="gStatus"></canvas></div>
      <div class="grafico"><h3>Por categoria</h3><canvas id="gCategoria"></canvas></div>
      <div class="grafico"><h3>Por nível de risco</h3><canvas id="gRisco"></canvas></div>
      <div class="grafico" id="blocoOrgao"><h3>Por órgão</h3><canvas id="gOrgao"></canvas></div>
      <div class="grafico" style="grid-column: 1 / -1"><h3>Registradas nos últimos 14 dias</h3><canvas id="gDia"></canvas></div>
    </div>
    <p id="semDados" class="vazio oculto">Ainda não há ocorrências para mostrar.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const CORES = ['#2f6fdf', '#e8a33d', '#2fa36b', '#d9534f', '#8e5bd1', '#17a2b8', '#7f8c8d'];
    const NOMES_STATUS = { REGISTRADA: 'Registrada', EM_ANALISE: 'Em análise', EM_ANDAMENTO: 'Em andamento', RESOLVIDA: 'Resolvida' };
    const NOMES_RISCO = { NAO_CLASSIFICADO: 'Não classificado', BAIXO: 'Baixo', MEDIO: 'Médio', ALTO: 'Alto' };
    const NOMES_PERFIL = { ADMINISTRADOR: 'administrador', ORGAO_PUBLICO: 'órgão público' };

    let nomesCategoria = {}, nomesOrgao = {};
    let usuario = null;
    const graficos = {};

    function mostrar(tela) {
      $('telaLogin').classList.toggle('oculto', tela !== 'login');
      $('telaPainel').classList.toggle('oculto', tela !== 'painel');
    }

    async function carregarNomes() {
      const [cats, orgs] = await Promise.all([
        fetch('/ocorrencias/categorias').then(r => r.json()),
        fetch('/ocorrencias/orgaos').then(r => r.json())
      ]);
      cats.forEach(c => nomesCategoria[c.codigo] = c.nome);
      orgs.forEach(o => {
        nomesOrgao[o.codigo] = o.nome;
        const op = document.createElement('option');
        op.value = o.codigo; op.textContent = o.nome;
        $('filtroOrgao').appendChild(op);
      });
    }

    function desenhar(id, tipo, mapa, nomes, opcoes = {}) {
      if (graficos[id]) graficos[id].destroy();
      const chaves = Object.keys(mapa);
      graficos[id] = new Chart($(id), {
        type: tipo,
        data: {
          labels: chaves.map(k => (nomes && nomes[k]) || k),
          datasets: [{
            label: 'Ocorrências',
            data: chaves.map(k => mapa[k]),
            backgroundColor: tipo === 'line' ? CORES[0] : chaves.map((_, i) => CORES[i % CORES.length]),
            borderColor: CORES[0],
            tension: .25
          }]
        },
        options: {
          indexAxis: opcoes.horizontal ? 'y' : 'x',
          plugins: { legend: { display: tipo === 'doughnut' } },
          scales: tipo === 'doughnut' ? {} : { [opcoes.horizontal ? 'x' : 'y']: { beginAtZero: true, ticks: { precision: 0 } } }
        }
      });
    }

    async function carregarPainel() {
      const filtro = $('filtroOrgao').value;
      const resp = await fetch('/estatisticas' + (filtro ? `?orgao=${filtro}` : ''));
      if (resp.status === 401) { mostrar('login'); return; }
      if (!resp.ok) { alert((await resp.json()).erro); return; }
      const d = await resp.json();

      $('kTotal').textContent = d.total;
      $('kResolvidas').textContent = d.resolvidas;
      $('kAbertas').textContent = d.total - d.resolvidas;
      $('kTaxa').textContent = (d.total ? Math.round(d.resolvidas * 100 / d.total) : 0) + '%';
      $('semDados').classList.toggle('oculto', d.total > 0);

      const dias = {};
      Object.entries(d.porDia).forEach(([iso, qtd]) => { const [, m, dia] = iso.split('-'); dias[`${dia}/${m}`] = qtd; });

      desenhar('gStatus', 'doughnut', d.porStatus, NOMES_STATUS);
      desenhar('gCategoria', 'bar', d.porCategoria, nomesCategoria, { horizontal: true });
      desenhar('gRisco', 'bar', d.porRisco, NOMES_RISCO);
      desenhar('gOrgao', 'bar', d.porOrgao, nomesOrgao);
      desenhar('gDia', 'line', dias);
    }

    async function entrarNoPainel() {
      const ehAdmin = usuario.perfil === 'ADMINISTRADOR';
      let quem = `${usuario.nome} (${NOMES_PERFIL[usuario.perfil] || usuario.perfil})`;
      $('quem').textContent = `Logado como ${quem}`;
      $('blocoFiltro').classList.toggle('oculto', !ehAdmin);   // só o administrador filtra por órgão
      $('blocoOrgao').classList.toggle('oculto', !ehAdmin);    // órgão público vê só o próprio
      mostrar('painel');
      await carregarPainel();
    }

    $('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resp = await fetch('/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: $('login').value, senha: $('senha').value })
      });
      const dados = await resp.json();
      const box = $('erroLogin');
      if (resp.ok) {
        box.textContent = ''; box.className = ''; $('senha').value = '';
        usuario = dados;
        entrarNoPainel();
      } else {
        box.className = 'msg';
        box.textContent = dados.campos ? Object.values(dados.campos).join(' | ') : dados.erro;
      }
    });

    $('sair').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      usuario = null;
      mostrar('login');
    });

    $('filtroOrgao').addEventListener('change', carregarPainel);

    (async function iniciar() {
      await carregarNomes();
      const resp = await fetch('/auth/eu');
      if (resp.ok) { usuario = await resp.json(); entrarNoPainel(); } else { mostrar('login'); }
    })();
  </script>
</body>
</html>
